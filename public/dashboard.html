<!DOCTYPE html>

  <head>

    />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  </head>
  <body onload="exibirDash()">
    <div class="container">
      <div class="navbar_dash">
        <div class="campos">
          <div class="campos1">
            <div class="perfil">
              <div><img src="./style/img/icons/logo.png" alt="Toy-Story"></div>
            </div>
            <div class="bem_vindo">Bem-vindo
              <span id="boas_vindas"></span>
            </div>
          </div>
          <div class="sair">
            <a href="index.html">Log Out</a>
          </div>
        </div>
      </div>

      <div class="dash">
        <div class="parte_cima">
          <div class="cima_dash">
          <div class="titulo">Sua Dashboard</div>

          <div class="kpi">
            <span id="kpi1">
              
            </span>
            <span id="kpi2">

            </span>
            <span id="kpi3">

            </span>
          </div>
          </div>

          <div class="dashboard">
            <div class="dash1">
              <div class="canvas">
                <canvas id="myChart"></canvas>
              </div>
            </div>
            <div class="dash2">
              <div class="canvas2">
                <canvas id="myChart2"></canvas>
              </div>
            </div>
          </div>
          <div class="dashboard2">
            <div class="canvas3">
              <canvas id="myChart3"></canvas>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>

<script>

  function exibirDash() {
    obterDadosGrafico()
    obterDadosGrafico2()
    obterDadosGrafico3()
    obterDadosGrafico_kpi()
  }

  boas_vindas.innerHTML = sessionStorage.NOME;

  // O gráfico é construído com três funções:
  // 1. obterDadosGrafico -> Traz dados do Banco de Dados para montar o gráfico da primeira vez
  // 2. plotarGrafico -> Monta o gráfico com os dados trazidos e exibe em tela
  // 3. atualizarGrafico -> Atualiza o gráfico, trazendo novamente dados do Banco

  // Esta função *obterDadosGrafico* busca os últimos dados inseridos em tabela de medidas.
  // para, quando carregar o gráfico da primeira vez, já trazer com vários dados.
  // A função *obterDadosGrafico* também invoca a função *plotarGrafico*

  //     Se quiser alterar a busca, ajuste as regras de negócio em src/controllers
  //     Para ajustar o "select", ajuste o comando sql em src/models

  function obterDadosGrafico() {
    fetch(`/dash/personagem`, { cache: "no-store" })
      .then(function (response) {
        if (response.ok) {
          response.json().then(function (resposta) {
            console.log(`Dados recebidos: ${JSON.stringify(resposta)}`);
            resposta.reverse();
            console.log(resposta)
            plotarGrafico(resposta);
          });
        } else {
          console.error("Nenhum dado encontrado ou erro na API");
        }
      })
      .catch(function (error) {
        console.error(
          `Erro na obtenção dos dados p/ gráfico: ${error.message}`
        );
      });
  }

  // Esta função *plotarGrafico* usa os dados capturados na função anterior para criar o gráfico
  // Configura o gráfico (cores, tipo, etc), materializa-o na página e,
  // A função *plotarGrafico* também invoca a função *atualizarGrafico*
  function plotarGrafico(resposta) {
    console.log("iniciando plotagem do gráfico...");

    // Criando estrutura para plotar gráfico - dados

    console.log("----------------------------------------------");
    console.log(
      'Estes dados foram recebidos pela funcao "obterDadosGrafico" e passados para "plotarGrafico":'
    );
    console.log(resposta);

    var listaValores = [];
    var listaNome = [];

    // Inserindo valores recebidos em estrutura para plotar o gráfico
    for (var i = 0; i < resposta.length; i++) {
      var registro = resposta[i];
      listaValores.push(registro.total);
      listaNome.push(registro.nome);
    }

    const myChart = document.getElementById("myChart");
    new Chart(myChart, {
      type: "bar",
      data: {
        labels: listaNome,
      datasets: [{
          label: "Personagem Favorito",
          data: listaValores,
          borderWidth: 1,
          backgroundColor: [
            "rgba(255, 0, 0, 0.700)",
            "rgba(0, 0, 255, 0.700)",
            "rgba(255, 255, 0, 0.700)",
            "rgba(0, 128, 0, 0.700)",
            "rgba(128, 0, 128, 0.700)",
            "rgba(165, 42, 42, 0.700)",
            "rgba(255, 192, 203, 0.800)",
            "rgba(139, 0, 0, 0.700)",
          ]
        }]
      }
    });
  }

    for (var i = 0; i < resposta.length; i++) {

    fetch(`/dash/kpi_faixa`, { cache: "no-store" })

        );
      });
  }
</script>
