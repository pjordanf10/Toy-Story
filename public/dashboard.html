<script>
  const ctx = document.getElementById("myChart");

  new Chart(ctx, {
    type: "bar",
    data: {
      labels: ["Wood", "Buzz", "Jessie", "Rex", "Salsicha", "Sr. Cabeça de Batata", "Sra. Cabeça de Batata", "Bala no Alvo"],
      datasets: [
        {
          label: "Personagem Favorito",
          data: [12, 19, 3, 5, 2, 3, 5, 9],
          borderWidth: 1,
          backgroundColor: ["rgba(255, 0, 0, 0.700)", "rgba(0, 0, 255, 0.700)", "rgba(255, 255, 0, 0.700)", "rgba(0, 128, 0, 0.700)", "rgba(128, 0, 128, 0.700)", "rgba(165, 42, 42, 0.700)", "rgba(255, 192, 203, 0.700)","rgba(139, 0, 0, 0.700)"]
        }
      ],
    },
    options: {
      scales: {
        y: {
          beginAtZero: true,
        },
      },
    },
  });

  const ctx2 = document.getElementById("myChart2");

  new Chart(ctx2, {
    type: "bar",
    data: {
      labels: ["Toy Story 1", "Toy Story 2", "Toy Story 3", "Toy Story 4"],
      datasets: [
        {
          label: "Filme Favorito",
          data: [12, 19, 3, 5],
          borderWidth: 1,
          backgroundColor: ["rgba(255, 0, 0, 0.700)", "rgba(0, 0, 255, 0.700)", "rgba(255, 255, 0, 0.700)", "rgba(0, 128, 0, 0.700)"]
        }
      ],
    },
    options: {
      scales: {
        y: {
          beginAtZero: true,
        },
      },
    },
  });

  function obterDadosGrafico(idAquario) {

        alterarTitulo(idAquario)

        if (proximaAtualizacao != undefined) {
            clearTimeout(proximaAtualizacao);
        }

        fetch(`/medidas/ultimas/${idAquario}`, { cache: 'no-store' }).then(function (response) {
            if (response.ok) {
                response.json().then(function (resposta) {
                    console.log(`Dados recebidos: ${JSON.stringify(resposta)}`);
                    resposta.reverse();

                    plotarGrafico(resposta, idAquario);

                });
            } else {
                console.error('Nenhum dado encontrado ou erro na API');
            }
        })
            .catch(function (error) {
                console.error(`Erro na obtenção dos dados p/ gráfico: ${error.message}`);
            });
    }
</script>
