          </div>
          <div>
            <p>Filme Favorito:</p> 
            <select name="" id="filme_select">
              <option value="*" disabled selected>Selecione um filme</option>
              <option value="1">Toy Story 1</option>
              <option value="2">Toy Story 2</option>
              <option value="3">Toy Story 3</option>
              <option value="4">Toy Story 4</option>
            </select>
            <br /><br />
          </div>
          <div>
            <p>E-mail:</p> 
            <input type="text" id="email_input" placeholder="buzz@gmail.com" />
            <br /><br />
          </div>
          <div>
            <p>Data de Nascimento:</p> 
            <input type="date" id="dt_nascimento_input" placeholder="22/12/1995" />
            <br /><br />
          </div>
          <div class="senha">
            <p>Senha:</p> 
            <input oninput="verificarSenha()" type="text" id="senha_input" placeholder="********" />
            
            <br />
            <span class="senha_mensagem" id="senha_mensagem"></span> <br>
          </div>
          <div>
            <p>Confirmar senha:</p> 
            <input type="text" id="confirmar_input" placeholder="********" />
            <br /><br />
          </div>
          <button onclick="cadastrar()">Cadastrar</button>
          <div class="conta">
            <p>Já possui uma conta? <a href="./login.html">Clique aqui</a></p>
          </div>

<script>

  var listaCaracteres = ['!', '@', '#', '$', '%', '&', '*', 1, 2, 3, 4, 5, 6, 7, 8, 9, 0];

  function verificarSenha() {
    
    var senha = senha_input.value;
    var msg = "";
    var temCaracter = false;

    for (var i = 0; i < listaCaracteres.length; i++) {
      if (senha.includes(listaCaracteres[i])) {
        temCaracter = true;
      }
    }

    if (temCaracter) {
        msg = `Senha Forte`;
        senha_mensagem.style.color = "green";
        temCaracter = true;
      } else {
        msg = `Senha Fraca`;
        senha_mensagem.style.color = "red";
      }

    senha_mensagem.innerHTML = msg;
  }

  // Array para armazenar empresas cadastradas para validação de código de ativação

    if (nomeVar.length < 3) {

  }

</script>
