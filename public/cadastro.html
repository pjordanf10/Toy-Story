    <div class="navbar">

    <div class="formulario">
      <div class="conteudo">
        <div class="titulo">
          <div class="imagem_cadastro">
            <img width="40px" src="./style/img/icons/wood.png" alt="" />
          </div>
          <div class="formulario_titulo">
            <h1>Cadastro</h1>
          </div>
        </div>
        <div class="campos">
          <div>
            <p>Nome:</p> <span id="*"></span>
            <input type="text" id="nome_input" placeholder="Buzz" />
            <br /><br />
          </div>
          <div>
            <p>Sobrenome:</p> <span id="*"></span>
            <input type="text" id="sobrenome_input" placeholder="Lightyear" />
            <br /><br />
          </div>
          <div>
            <p>Personagem Favorito:</p> <span id="*"></span>
            <select name="" id="personagem_select">
              <option value="*" disabled selected>Escolha um personagem</option>
              <option value="wood">Wood</option>
              <option value="buzz">Buzz</option>
              <option value="jessie">Jessie</option>
              <option value="rex">Rex</option>
              <option value="salsicha">Salsicha</option>
              <option value="cabeça_de_batata">Sr. Cabeça de Batata</option>
              <option value="hamm">Hamm</option>
              <option value="bala_no_alvo">Bala no Alvo</option>
            </select>
            <br /><br />
          </div>
          <div>
            <p>Filme Favorito:</p> <span id="*"></span>
            <select name="" id="filme_select">
              <option value="*" disabled selected>Selecione um filme</option>
              <option value="1">Toy Story 1</option>
              <option value="2">Toy Story 2</option>
              <option value="3">Toy Story 3</option>
              <option value="4">Toy Story 4</option>
            </select>
            <br /><br />
          </div>
          <div>
            <p>E-mail:</p> <span id="*"></span>
            <input type="text" id="email_input" placeholder="buzz@gmail.com" />
            <br /><br />
          </div>
          <div>
            <p>Data de Nascimento:</p> <span id="*"></span>
            <input type="date" id="dt_nascimento_input" placeholder="22/12/1995" />
            <br /><br />
          </div>
          <div>
            <p>Senha:</p> <span id="*"></span>
            <input type="text" id="senha_input" placeholder="********" />
            <br /><br />
          </div>
          <div>
            <p>Confirmar senha:</p> <span id="*"></span>
            <input type="text" id="confirmar_input" placeholder="********" />
            <br /><br />
          </div>
          <button onclick="cadastrar()">Cadastrar</button>
          <div class="conta">
            <p>Já possui uma conta? <a href="./login.html">Clique aqui</a></p>
          </div>
        </div>
      </div>
    </div>

    <div class="footer">
      <div class="titulo">
        <h3>Projeto Individual - Philipi Jordan</h3>
      </div>
      <div class="redes">
        <a href=""><img width="50" height="50" src="https://img.freepik.com/vetores-premium/icone-do-instagram-de-logotipo-de-distintivo-moderno_578229-124.jpg?semt=ais_incoming&w=740&q=80" alt="" /></a>
        <a href="https://github.com/pjordanf10/Toy-Story.git"><img width="50" height="50" src="https://yt3.googleusercontent.com/PKRBxhCiGa8Y0vPmHa1E2cdjpLhUq2Pl-gESwP7kk2plGgxLdsbjyTd9VjcJwBMiY0HQ8bvx5Q=s900-c-k-c0x00ffffff-no-rj" alt="" /></a>
      </div>
    </div>
  </body>
</html>
